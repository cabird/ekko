<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ekko</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235b8def'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%235b8def' stroke-width='2' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%235b8def' stroke-width='1.5' opacity='.25'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">ekko</span>
      <span class="brand-sub" id="brand-sub"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-ask" title="Ask a question across your sessions (a)">Ask</button>
      <button class="btn ghost" id="btn-status" title="Index status">Status</button>
      <button class="btn ghost icon tip-r" id="btn-theme" data-tip="Toggle light / dark theme">◐</button>
      <button class="btn ghost icon tip-r" id="btn-help" data-tip="Keyboard shortcuts (?)">?</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="search-row">
        <input id="q" type="search" placeholder="Filter sessions…  (/)" autocomplete="off" spellcheck="false">
      </div>
      <div class="mode-row" id="search-mode" role="radiogroup" aria-label="Search mode">
        <!-- Segmented control; icons are inline SVG so no font/emoji drift. -->
        <button class="mode active tip-l" data-mode="filter" data-tip='Filter (default) — narrows the list as you type. Every word must appear somewhere in the session (title, prompt, summary or keywords), in any order, as a substring. Use "quotes" for an exact contiguous phrase. The other modes run real searches.'>
          <svg viewBox="0 0 16 16"><path d="M2 3h12l-4.5 5v4l-3 1.5V8L2 3z"/></svg><span>filter</span>
        </button>
        <button class="mode" data-mode="keyword" data-tip="Keyword — full-text search over titles, summaries and keywords, ranked by relevance">
          <svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4" fill="none" stroke-width="2"/><path d="M9.8 9.8L14 14" stroke-width="2"/></svg><span>keyword</span>
        </button>
        <button class="mode" data-mode="transcript" data-tip="Transcript — full-text search inside the conversation text itself">
          <svg viewBox="0 0 16 16"><path d="M3 2h10v12H3z" fill="none" stroke-width="1.6"/><path d="M5 5h6M5 8h6M5 11h4" stroke-width="1.4"/></svg><span>text</span>
        </button>
        <button class="mode tip-r" data-mode="semantic" data-tip="Semantic — the LLM ranks sessions by meaning, not words. Runs on Enter">
          <svg viewBox="0 0 16 16"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13 6.4 8.6 2 7l4.4-1.6L8 1z"/><path d="M13 11l.7 1.8L15.5 13.5l-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7L13 11z"/></svg><span>semantic</span>
        </button>
        <button class="mode tip-r" data-mode="hybrid" data-tip="Hybrid — keyword, then transcript, then semantic, until something matches. Runs on Enter">
          <svg viewBox="0 0 16 16"><path d="M2 4h8M2 8h12M2 12h6" stroke-width="2"/><path d="M12.5 2.5l2 1.8-2 1.8" fill="none" stroke-width="1.6"/></svg><span>hybrid</span>
        </button>
      </div>
      <div class="facets">
        <span class="select">
          <select id="f-project" title="Project"><option value="">All projects</option></select>
        </span>
        <div class="seg" id="f-source" role="radiogroup" aria-label="Source">
          <button class="seg-b active" data-v="" title="All sources">all</button>
          <button class="seg-b" data-v="claude_code" title="Claude Code">claude</button>
          <button class="seg-b" data-v="vscode_copilot" title="VS Code Copilot">vscode</button>
          <button class="seg-b" data-v="github_copilot" title="Copilot CLI">copilot</button>
          <button class="seg-b" data-v="codex" title="OpenAI Codex">codex</button>
        </div>
        <div class="seg" id="f-days" role="radiogroup" aria-label="Time window">
          <button class="seg-b active" data-v="" title="Any time">any</button>
          <button class="seg-b" data-v="1" title="Last 24 hours">24h</button>
          <button class="seg-b" data-v="7" title="Last 7 days">7d</button>
          <button class="seg-b" data-v="30" title="Last 30 days">30d</button>
          <button class="seg-b" data-v="90" title="Last 90 days">90d</button>
        </div>
      </div>
      <div class="list-meta">
        <span id="list-meta-text" class="grow"></span>
        <span class="select sort"><select id="f-sort" title="Sort by">
          <option value="">by modified</option>
          <option value="created">by created</option>
          <option value="duration">by duration</option>
          <option value="messages">by messages</option>
        </select></span>
      </div>
      <ul class="session-list" id="session-list" role="listbox" aria-label="Sessions"></ul>
      <div class="pager" id="pager"></div>
    </aside>

    <main class="detail" id="detail">
      <div class="empty" id="empty-state">
        <div class="empty-mark" aria-hidden="true"></div>
        <p>Select a session, or press <kbd>/</kbd> to search.</p>
      </div>
      <article class="session" id="session" hidden>
        <header class="session-head">
          <button class="btn ghost back" id="btn-back" title="Back to the list (Esc)">‹ Sessions</button>
          <h1 id="s-title"></h1>
          <div class="meta-row" id="s-meta"></div>
          <p class="short-desc" id="s-short"></p>
        </header>
        <nav class="tabs" role="tablist">
          <button class="tab" data-tab="summary" role="tab">Summary</button>
          <button class="tab" data-tab="snapshot" role="tab">Snapshot</button>
          <button class="tab" data-tab="transcript" role="tab">Transcript</button>
          <button class="tab" data-tab="files" role="tab">Files</button>
        </nav>
        <section class="panel" data-panel="summary"></section>
        <section class="panel" data-panel="snapshot" hidden></section>
        <section class="panel" data-panel="transcript" hidden>
          <div class="transcript-tools">
            <label><input type="checkbox" id="t-show-tools" checked> tool calls</label>
            <label><input type="checkbox" id="t-show-results"> tool output</label>
            <span class="grow"></span>
            <span id="t-count" class="muted"></span>
          </div>
          <div id="t-body"></div>
        </section>
        <section class="panel" data-panel="files" hidden></section>
      </article>
    </main>
  </div>

  <dialog id="dlg-ask" class="dlg">
    <!-- Plain form + preventDefault: with method="dialog", Enter in a text
         field would submit via the first button (Close) and eat the question. -->
    <form class="dlg-body" id="ask-form">
      <h2>Ask your sessions</h2>
      <textarea id="ask-q" rows="3" placeholder="e.g. Why did we choose a flat 60s backoff for 429s?  (⌘↩ to ask)"></textarea>
      <div class="ask-opts">
        <input id="ask-dir" type="text" placeholder="Scope to directory (optional)">
        <select id="ask-days">
          <option value="">Any time</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
        <button class="btn primary" id="ask-go" type="submit">Ask</button>
        <button class="btn ghost" id="ask-close" type="button">Close</button>
      </div>
      <div id="ask-out" class="ask-out"></div>
    </form>
  </dialog>

  <dialog id="dlg-status" class="dlg">
    <div class="dlg-body">
      <h2>Status</h2>
      <div id="status-out"></div>
      <form method="dialog"><button class="btn ghost">Close</button></form>
    </div>
  </dialog>

  <dialog id="dlg-help" class="dlg">
    <div class="dlg-body">
      <h2>Keyboard</h2>
      <table class="keys">
        <tr><td><kbd>/</kbd></td><td>focus search</td></tr>
        <tr><td><kbd>j</kbd> / <kbd>k</kbd></td><td>next / previous session</td></tr>
        <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Summary / Snapshot / Transcript / Files</td></tr>
        <tr><td><kbd>a</kbd></td><td>ask</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>close dialog / blur search</td></tr>
      </table>
      <form method="dialog"><button class="btn ghost">Close</button></form>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
