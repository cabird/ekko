[package]
name = "ekko"
version = "1.2.4"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
minijinja = "2.23.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.20"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
